name: Verify architecture decisions

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    name: Verify ADR library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - name: Verify decisions and run contract tests
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Build and verify source archive
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B scripts/package_source.py $commit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.os == 'Linux'
        with:
          go-version: '1.27.4'
          cache: false
      - name: Scan Git history for secrets
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .
